services:
  db:
    image: postgres:16-alpine
    container_name: jobtracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: jobtracker-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # use the synchronous psycopg2 driver (psycopg2-binary is installed in the image)
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/jobtracker
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --workers 1

  # One-shot job scraper. It is NOT started by a plain `docker compose up`.
  # Run it with:  docker compose --profile seed run --rm scraper
  # Optionally pass board tokens:  ... run --rm scraper stripe airbnb gitlab
  scraper:
    build: .
    profiles: ["seed"]
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
      # comma-separated Greenhouse/Lever board tokens (used when no CLI args given)
      AGG_COMPANIES: "stripe,airbnb,databricks,gitlab,cloudflare"
      AGG_FILTER: "1"
    entrypoint: ["python", "-m", "services.scraper.populate_db"]
    command: []

volumes:
  postgres_data:
